name: generate contribution graph

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: generate pacman graph
        uses: Platane/snk@v3
        with:
          github_user_name: ShaikMishaTabassum
          outputs: |
            dist/pacman-contribution-graph.svg?palette=github-dark
      - name: push graph to output branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: output
          publish_dir: ./dist
